name: FitnessTracker
options:
  bundleIdPrefix: com.fitnesstracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FitnessTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitnessTracker
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitnesstracker.app
        PRODUCT_NAME: FitnessTracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fitness Tracker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ENABLE_TESTABILITY: YES
    dependencies:
      - sdk: Charts.framework
    scheme:
      testTargets:
        - FitnessTrackerTests
      gatherCoverageData: false
  FitnessTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FitnessTrackerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitnesstracker.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitnessTracker.app/FitnessTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: FitnessTracker
schemes:
  FitnessTracker:
    build:
      targets:
        FitnessTracker: all
        FitnessTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitnessTrackerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
